<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Cusor - Infinite Art Flow</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <canvas id="artCanvas"></canvas>
    
    <div class="ambient-glow"></div>
    <div class="cursor-aura"></div> 
    <div class="cursor">
        <div class="cursor-outer"></div>
        <div class="cursor-inner"></div>
    </div>
    
    <header class="header">
        <div class="logo">SPACE CUSOR</div>
        <div class="mode-indicator">
            <div class="mode-dot"></div>
            <span class="mode-text" id="modeText">Interactive Mode</span>
        </div>
    </header>
    
    <div class="download-button-container">
        <button class="action-btn" onclick="downloadArt()">✦ Download Artwork</button>
    </div>

    <footer class="footer">
        <div class="footer-text">
            SPACE CUSOR • INFINITE GENERATIVE ART • VERSION 1.0
        </div>
    </footer>

    <script src="script.js"></script> 
</body>
</html>
